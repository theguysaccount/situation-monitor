# Sweeps every source every 30 minutes, sends alerts, and publishes the site to GitHub Pages.
# Third-party actions are pinned to commit SHAs (the master prompt asks teams to do the same).
name: Situation Monitor sweep

on:
  schedule:
    # Every 30 minutes, off the top and bottom of the hour: GitHub delays and drops scheduled runs
    # at busy minutes (":00/:30" ran only every 3-4 hours). health.yml also starts a sweep when the
    # live data is overdue.
    - cron: "13,43 * * * *"
  # A new SITREP or a code change deploys right away instead of waiting for the next sweep.
  push:
    branches: [main]
    paths:
      - "sitrep.json"
      - "site/app.html"
      - "monitor.py"
      - "sources.json"
      - "config.json"
      - "MASTER_PROMPT.md"
      - ".github/workflows/situation-monitor.yml"
      - "ops/check_build.py"
      - "ops/archive.py"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: situation-monitor
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # The monitor's memory (what it has seen and already alerted on) lives in the Actions cache,
      # so sweeps don't need to commit anything back to the repository.
      - name: Restore monitor state
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: state
          key: situation-state-${{ github.run_id }}
          restore-keys: situation-state-

      # GitHub evicts caches unused for 7 days. If that happened, start from the memory archived on the
      # data branch (at most a day old) instead of from nothing, which would re-flag every report as new.
      - name: Fall back to the archived state
        run: |
          if [ ! -f state/items.json ] && git fetch -q --depth 1 origin data 2>/dev/null; then
            mkdir -p archive
            if git archive FETCH_HEAD state 2>/dev/null | tar -x -C archive 2>/dev/null; then
              python ops/archive.py restore --state state --archive archive
            else
              echo "The data branch has no archived state yet; starting fresh."
            fi
          fi

      - name: Sweep sources and send alerts
        env:
          SM_SITE_URL: ${{ vars.SM_SITE_URL }}
          SM_SCHEDULE_NOTE: Every 30 minutes, via GitHub Actions
          SM_WATCHLIST: ${{ vars.SM_WATCHLIST }}
          SM_MIN_SEVERITY: ${{ vars.SM_MIN_SEVERITY }}
          SM_SLACK_WEBHOOK: ${{ secrets.SM_SLACK_WEBHOOK }}
          SM_TEAMS_WEBHOOK: ${{ secrets.SM_TEAMS_WEBHOOK }}
          SM_DISCORD_WEBHOOK: ${{ secrets.SM_DISCORD_WEBHOOK }}
          SM_NTFY_TOPIC: ${{ secrets.SM_NTFY_TOPIC }}
          SM_WEBHOOK_URL: ${{ secrets.SM_WEBHOOK_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python monitor.py

      # Fails (so nothing below runs and the last good deploy stays live) if the page, data, feed,
      # prompt, sitemap or IndexNow key is missing or broken, the data isn't from this sweep, or
      # fewer than 60% of sources answered.
      - name: Refuse to deploy a broken or stale site
        run: python ops/check_build.py

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

      # The archive job below writes the data branch; this job keeps read-only repository access.
      - name: Hand the sweep's memory to the archive job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: archive-input
          retention-days: 1
          path: |
            state/items.json
            state/seen.json
            state/meta.json
            state/history.json
            state/sources_status.json
            site/data/situation.json

      # On pushes, and otherwise at most once every 20 hours (the stamp lives in the cached state/).
      # Never fails the run.
      - name: Ping IndexNow
        run: |
          site=$(python -c "import json; print(json.load(open('site/data/situation.json'))['site_url'])")
          stamp=state/indexnow-last-ping
          last=$(cat "$stamp" 2>/dev/null || echo 0)
          if [ "$GITHUB_EVENT_NAME" = "push" ] || [ $(( $(date +%s) - last )) -ge 72000 ]; then
            if python ops/indexnow.py --strict --retries 1 --key-file site/211bbe7db0768144330cc34893c045a0.txt --base "$site" "$site" "${site}data/master-prompt.md"; then
              date +%s > "$stamp"
            else
              echo "IndexNow did not accept the ping; the next sweep retries."
            fi
          else
            echo "Pinged $(( ($(date +%s) - last) / 3600 )) h ago; skipping."
          fi

  # The permanent record (see ops/archive.py): every briefing, one snapshot per finished day and, once a
  # day, the sweep's memory, committed to the orphan `data` branch. Most sweeps add nothing.
  archive:
    needs: sweep
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: archive-input
          path: incoming

      - name: Update the data branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth setup-git
          repo="https://github.com/${GITHUB_REPOSITORY}.git"
          if ! git ls-remote --exit-code --heads "$repo" data >/dev/null; then
            git init -q -b data archive && git -C archive remote add origin "$repo"
          else
            git clone -q --depth 1 --branch data "$repo" archive
          fi
          python3 ops/archive.py save --state incoming/state --site incoming/site --archive archive --sitrep sitrep.json
          cd archive
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing new to archive."
            exit 0
          fi
          stamp=$(python3 -c 'import json; print(json.load(open("../incoming/site/data/situation.json"))["generated_at"])')
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Archive after the sweep of $stamp"
          git push -q origin HEAD:data
